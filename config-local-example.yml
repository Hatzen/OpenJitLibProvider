# OpenJitLibProvider Configuration
# Copy this file to ./config.yml and customize for your environment.

# Server HTTP Port
NEXUS_PORT: 5000

# JDK Installations for cross-version Gradle & Maven builds
# Provide paths for installed JDKs on your system (Windows or Linux)
JAVA_HOME:
  "8": "C:/Program Files/Java/jdk-8"
  "11": "C:/Program Files/Java/jdk-11"
  "17": "C:/Program Files/Java/jdk-17"
  "21": "C:/Program Files/Java/jdk-21"

# Android SDK Path (for Android library builds)
ANDROID_SDK_ROOT: "C:/Users/user/AppData/Local/Android/Sdk"

# Known Git Hosts Mapping
# package prefix : git domain
KNOWN_HOSTS:
  "com.github": "github.com"
  "com.gitlab": "gitlab.com"
  "org.bitbucket": "bitbucket.org"
  "com.gitee": "gitee.com"
  "com.azure": "dev.azure.com"

# Authentication tokens for private repositories
# Lookup matches by 'owner/repo', 'repo', 'owner', or 'default'
REPOSITORY_TOKENS:
  "default": ""
  "ExampleOwner/ExampleRepo": "github_pat_xxxx"

# Automated cleanup schedule in days (-1 to disable)
DELETE_ARTIFACTS: -1   # Delete unused repo artifacts older than N days
DELETE_TMP: 1          # Delete temporary build clones older than N days